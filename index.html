<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Surrounded by Idiots Interactive</title>
<style>
/* Apple-style: system type, large titles, translucent chrome, borderless grouped cards, capsule controls, spring-like easing. */
:root{
  --bg:#F5F5F7; --panel:#FFFFFF; --ink:#1D1D1F; --muted:#6E6E73; --line:rgba(0,0,0,.08); --chip:#F2F2F7;
  --R:#FF3B30; --Y:#D98E00; --G:#2DB44E; --B:#0A7AFF; --N:#8E8E93;
  --Rbg:rgba(255,59,48,.11); --Ybg:rgba(255,176,0,.17); --Gbg:rgba(48,182,80,.12); --Bbg:rgba(10,122,255,.11); --Nbg:rgba(142,142,147,.14);
  --bar:rgba(245,245,247,.72); --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 30px rgba(0,0,0,.06);
  --ease:cubic-bezier(.32,.72,0,1);
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000; --panel:#1C1C1E; --ink:#F5F5F7; --muted:#98989F; --line:rgba(255,255,255,.1); --chip:#2C2C2E;
    --R:#FF453A; --Y:#FFD60A; --G:#32D74B; --B:#0A84FF; --N:#8E8E93;
    --Rbg:rgba(255,69,58,.2); --Ybg:rgba(255,214,10,.17); --Gbg:rgba(50,215,75,.18); --Bbg:rgba(10,132,255,.2); --Nbg:rgba(142,142,147,.2);
    --bar:rgba(0,0,0,.66); --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000; --panel:#1C1C1E; --ink:#F5F5F7; --muted:#98989F; --line:rgba(255,255,255,.1); --chip:#2C2C2E;
  --R:#FF453A; --Y:#FFD60A; --G:#32D74B; --B:#0A84FF; --N:#8E8E93;
  --Rbg:rgba(255,69,58,.2); --Ybg:rgba(255,214,10,.17); --Gbg:rgba(50,215,75,.18); --Bbg:rgba(10,132,255,.2); --Nbg:rgba(142,142,147,.2);
  --bar:rgba(0,0,0,.66); --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.47 var(--sys);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
h1,h2,h3,h4{margin:0;text-wrap:balance}
.wrap{max-width:780px;margin:0 auto}
:focus-visible{outline:3px solid color-mix(in srgb,var(--B) 60%,transparent);outline-offset:2px}
button:active:not(:disabled),.opt:active:not(:disabled),.fl:active{transform:scale(.97);transition:transform .1s ease-out}

/* translucent chrome */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px))) 0 calc(-1*max(16px,env(safe-area-inset-right,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 .5px 0 var(--line);display:flex;align-items:center;gap:12px}
.top .nm{font-weight:600;font-size:15px;white-space:nowrap}
.pbar{flex:1;height:4px;border-radius:2px;background:var(--line);overflow:hidden;min-width:40px}
.pbar i{display:block;height:100%;width:0;border-radius:2px;background:var(--B);transition:width .7s var(--ease)}
.cnt{font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.ibtn{border:0;background:var(--Bbg);color:var(--B);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
#drawer{position:fixed;z-index:50;top:0;bottom:0;left:0;width:min(340px,88vw);background:var(--panel);padding:0 10px 24px;overflow:auto;overscroll-behavior:contain;transform:translateX(-104%);visibility:hidden;transition:transform .45s var(--ease),visibility 0s .45s;box-shadow:8px 0 40px rgba(0,0,0,.2)}
.scrim{position:fixed;inset:0;z-index:45;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .35s}
.scrim.on{opacity:1;pointer-events:auto}
.dhead{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:calc(14px + env(safe-area-inset-top,0px)) 6px 10px;background:var(--panel);margin-bottom:4px}
.dhead b{font-size:22px;font-weight:700;letter-spacing:-.025em}
.dclose{width:34px;height:34px;border:0;border-radius:50%;background:var(--chip);color:var(--muted);font-size:16px;line-height:1;display:grid;place-items:center}
#drawer.open{transform:none;visibility:visible;transition:transform .45s var(--ease),visibility 0s}
#drawer a{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;color:inherit;text-decoration:none;font-size:15px;line-height:1.3}
#drawer a:hover{background:var(--line)}
#drawer .dn{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
#drawer .ck{margin-left:auto;color:var(--G);font-weight:700}

/* type */
.eyebrow{font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--c,var(--muted))}
.lesson h2,.hero h1{font-weight:700}
.lesson>h2{font-size:clamp(34px,6.4vw,52px);line-height:1.05;letter-spacing:-.03em;margin:6px 0 14px}
.intro{font-size:clamp(19px,2.6vw,22px);line-height:1.4;color:var(--muted);margin:0 0 8px;max-width:30em;letter-spacing:-.016em}

/* hero */
.hero{padding:56px 0 20px;display:grid;gap:22px;text-align:center;justify-items:center}
.hero h1{font-size:clamp(40px,8.4vw,76px);line-height:1.03;letter-spacing:-.04em}
.hero .intro{margin:0 auto}
.hero h2{font-size:26px;letter-spacing:-.025em;font-weight:700}
.cta{background:var(--B);color:#fff;border:0;border-radius:999px;padding:14px 28px;font-weight:600;font-size:17px;transition:transform .1s,filter .2s}
.cta:hover{filter:brightness(1.08)}
.meet{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;text-align:left;width:100%}
.meet .mc{border-radius:26px;padding:20px 18px 18px;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.meet .mc .av{margin:0 0 12px}
.meet .mc h3{color:var(--c);font-size:24px;letter-spacing:-.02em;margin:0}
.meet .mc .role{font-weight:600;margin:0 0 6px}
.meet .mc p{font-size:15px;line-height:1.4;color:var(--muted)}
.meet .mc .says{margin-top:14px;padding:10px 12px;border-radius:14px;background:var(--cbg);font-weight:600;font-size:15px;color:var(--ink);line-height:1.3}
.meet .mc small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-bottom:3px}
.words{max-width:36em;font-size:14px;line-height:1.5;color:var(--muted);text-align:left}
.words b{color:var(--ink);font-weight:600}

/* avatars */
.av{width:56px;height:56px;display:block;animation:bob 4s ease-in-out infinite}
.av .eye{transform-origin:center;transform-box:fill-box;animation:blink 5s infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* sections */
.sec{padding:0;scroll-margin-top:70px}
.lesson{padding:72px 0 8px;scroll-margin-top:50px}
.lesson+.lesson{border-top:.5px solid var(--line)}
.big{font-size:clamp(28px,5.4vw,46px);line-height:1.08;letter-spacing:-.032em;font-weight:700;margin:26px 0 26px;text-wrap:balance;color:var(--ink)}
.big small{display:block;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--c);margin-bottom:8px}
.mod{background:var(--panel);border-radius:28px;padding:clamp(18px,3.4vw,28px);margin:16px 0;box-shadow:var(--shadow)}
.mod>h3{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:4px}
.sub{margin:0 0 16px;color:var(--muted);font-size:16px;line-height:1.4}
.js .rv{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.done-row{display:flex;justify-content:center;margin:26px 0 0}
.donebtn{border:0;background:var(--chip);border-radius:999px;padding:11px 22px;font-weight:600;color:var(--muted);transition:background .3s,color .3s}
.donebtn.on{background:var(--G);color:#fff}
.sowhat{margin:16px 0 0;padding:20px 22px;border-radius:24px;background:var(--cbg)}
.sowhat b{display:block;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--c);margin-bottom:4px}
.sowhat{font-size:18px;line-height:1.4;letter-spacing:-.015em}

/* buttons */
.nextbtn{margin-top:14px;border:0;background:var(--B);color:#fff;border-radius:999px;padding:11px 22px;font-weight:600}
.nextbtn[hidden]{display:none}
.nextbtn:disabled{opacity:.4}
.ghost{border:0;background:var(--chip);border-radius:999px;padding:11px 20px;font-weight:600}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:0;background:var(--chip);border-radius:999px;padding:9px 16px;font-weight:600;font-size:15px;transition:background .25s,color .25s}
.pill.on{color:#fff}
.pill:disabled{opacity:.4}

/* chat */
.chat{display:flex;flex-direction:column;gap:8px;max-width:560px}
.bub{display:flex;gap:10px;align-items:flex-end;animation:pop .5s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.94)}}
.bub .av{width:34px;height:34px;flex:none;animation:none}
.bub .tx{padding:10px 15px;border-radius:20px 20px 20px 6px;max-width:84%;border:0!important;line-height:1.35}
.bub .tx b{display:block;font-size:11px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;margin-bottom:1px}
.typing{display:inline-flex;gap:4px;padding:6px 2px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes dot{50%{transform:translateY(-4px);opacity:.4}}

/* questions: inset grouped list */
.q{font-size:22px;line-height:1.2;font-weight:600;letter-spacing:-.025em;margin:0 0 14px}
.opts{display:grid;gap:0;background:var(--chip);border-radius:18px;overflow:hidden}
.opt{text-align:left;border:0;border-top:.5px solid var(--line);background:transparent;padding:15px 18px;display:flex;justify-content:space-between;gap:12px;align-items:center;transition:background .2s}
.opt:first-child{border-top:0}
.opt:hover:not(:disabled){background:var(--line)}
.opt.ok{background:var(--Gbg);font-weight:600}
.opt.ok:after{content:"✓";color:var(--G);font-weight:700}
.opt.bad{background:var(--Rbg);animation:shake .4s}
.opt.bad:after{content:"✕";color:var(--R);font-weight:700}
.opt:disabled{cursor:default;color:var(--ink)}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{margin:14px 0 0;padding:14px 16px;border-radius:16px;background:var(--chip);font-size:16px}
.mq .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.mailbox{font:14px/1.5 ui-monospace,"SF Mono",Menlo,monospace;background:var(--chip);border-radius:16px;padding:14px 16px;margin:0 0 14px;white-space:pre-wrap}

/* flip cards */
.flips{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:10px}
.fl{perspective:900px;border:0;background:none;padding:0;min-height:150px;text-align:left}
.fl .in{position:relative;width:100%;height:100%;min-height:150px;transition:transform .8s var(--ease);transform-style:preserve-3d}
.fl.f .in{transform:rotateY(180deg)}
.fl .s{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:16px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.fl .s b{font-size:22px;font-weight:700;letter-spacing:-.025em}
.fl .s .hint{font-size:12px;opacity:.7;margin:0}
.fl .back{transform:rotateY(180deg);font-weight:500;line-height:1.3}

/* static visuals */
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch;margin-top:10px}
.flow .st{flex:1 1 130px;padding:14px;border-radius:18px;background:var(--chip);font-weight:600;line-height:1.3}
.flow .st:before{content:"";display:block;width:22px;height:4px;border-radius:2px;background:var(--c,var(--N));margin-bottom:10px}
.flow .ar{align-self:center;color:var(--muted);font-size:18px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.col{padding:16px 18px;border-radius:20px;background:var(--chip);min-width:0}
.col h4{margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted)}
.col.good h4{color:var(--G)}.col.bad h4{color:var(--R)}
.col ul{list-style:none;margin:0;padding:0}.col li{padding:7px 0;border-top:.5px solid var(--line)}.col li:first-child{border:0}
.bars{display:grid;gap:14px;max-width:640px;margin-top:12px}
.bars .lb{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px;gap:10px}
.bars .tr{height:14px;background:var(--chip);border-radius:7px;overflow:hidden}
.bars .fi{height:100%;width:0;border-radius:7px;transition:width 1.2s var(--ease)}
.quote{font-size:clamp(22px,3.8vw,32px);line-height:1.22;font-weight:700;letter-spacing:-.028em}
.quote small{display:block;font-size:15px;font-weight:400;letter-spacing:-.011em;color:var(--muted);margin-top:8px}
.traits{display:flex;gap:8px;flex-wrap:wrap}
.traits span{padding:7px 14px;border-radius:999px;font-weight:600;font-size:15px;background:var(--cbg);color:var(--c)}
.prof{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.prof .av{width:92px;height:92px}
.prof h3{font-size:26px;letter-spacing:-.025em;color:var(--c)}
.steps{display:grid;gap:8px;counter-reset:s;max-width:620px;margin-top:10px}
.steps div{display:flex;gap:14px;align-items:center;padding:13px 16px;border-radius:18px;background:var(--chip)}
.steps div:before{counter-increment:s;content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--c,var(--N));color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.tl{position:relative;padding-left:28px;max-width:600px;margin-top:10px}
.tl:before{content:"";position:absolute;left:8px;top:8px;bottom:8px;width:2px;border-radius:1px;background:var(--line)}
.tl div{position:relative;padding:0 0 18px}
.tl div:before{content:"";position:absolute;left:-26px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--B)}
.tl b{display:block;font-size:19px;letter-spacing:-.02em}

/* games */
.listen{margin:10px 0 14px}
.msgrow{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center}
.msg{background:var(--ink);color:var(--bg);padding:13px 16px;border-radius:20px;font-weight:600;line-height:1.3}
.funnel{width:40px;height:40px;opacity:.5}
.heard{padding:13px 16px;border-radius:20px;font-weight:600;min-height:64px;background:var(--cbg);color:var(--c);animation:pop .5s var(--ease);line-height:1.3}
@media (max-width:560px){.msgrow{grid-template-columns:1fr}.funnel{transform:rotate(90deg);margin:0 auto}}
.onion{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-top:10px}
.rings{position:relative;width:240px;height:240px;flex:none}
.ring{position:absolute;border-radius:50%;border:0;display:grid;place-items:center;font-weight:600;font-size:12px;color:#fff;transition:transform .4s var(--ease),box-shadow .3s}
.ring:hover{transform:scale(1.03)}
.ring.sel{box-shadow:0 0 0 4px var(--panel),0 0 0 7px var(--ink)}
.rbox{flex:1 1 220px;min-width:0;padding:16px 18px;border-radius:20px;background:var(--chip)}
.mx{position:relative;max-width:440px;aspect-ratio:1;margin:30px 0 30px 30px;display:grid;grid-template-columns:1fr 1fr;gap:6px;touch-action:none;user-select:none}
.mx .c{border-radius:22px;padding:14px;font-size:19px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:flex-start}
.mx .ax{position:absolute;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mx .dot{position:absolute;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:var(--ink);box-shadow:0 6px 20px rgba(0,0,0,.3);cursor:grab;display:grid;place-items:center;color:var(--bg);font-weight:700;touch-action:none}
.mx .dot:active{cursor:grabbing;transform:scale(1.12)}
.sky{position:relative;height:280px;border-radius:24px;overflow:hidden;background:linear-gradient(#8E99AB,#C4CCD9);transition:background 1.4s;margin-top:10px}
.sky.sun{background:linear-gradient(#6EB8F0,#D8EFFD)}
.cloud{position:absolute;top:26px;left:8%;width:150px;height:56px;background:#F0F2F6;border-radius:40px;box-shadow:40px -18px 0 8px #F0F2F6,-30px 6px 0 -4px #F0F2F6;transition:opacity 1.2s,transform 1.6s var(--ease)}
.sky.sun .cloud{opacity:0;transform:translateX(160px)}
.drops{position:absolute;inset:70px 0 0;opacity:0;background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(255,255,255,.55) 22px 23.5px);animation:rain .5s linear infinite;transition:opacity .5s}
.sky.wet .drops{opacity:1}.sky.sun .drops{opacity:0}
@keyframes rain{to{background-position:-30px 40px}}
.sunny{position:absolute;right:12%;top:20px;width:70px;height:70px;border-radius:50%;background:#FFCC00;box-shadow:0 0 0 14px rgba(255,204,0,.28);opacity:0;transform:scale(.3);transition:all 1.1s var(--ease)}
.sky.sun .sunny{opacity:1;transform:none}
.rb{position:absolute;left:50%;bottom:0;width:320px;height:160px;margin-left:-160px;opacity:0;transform:scale(.85);transform-origin:50% 100%;transition:opacity 1.6s var(--ease) .4s,transform 1.6s var(--ease) .4s}
.sky.sun .rb{opacity:.92;transform:none}
.sky .who{position:absolute;left:50%;bottom:0;width:60px;margin-left:-30px}
.sky .who .av{width:60px;height:60px}
.sky .ground{position:absolute;left:0;right:0;bottom:0;height:10px;background:rgba(0,0,0,.12)}
.sky .who2{position:absolute;left:11%;bottom:0;width:52px}
.sky .who2 .av{width:52px;height:52px}
.sky .who{z-index:2}
.say{position:absolute;z-index:4;bottom:68px;max-width:min(300px,64%);background:#fff;color:#1D1D1F;padding:12px 16px;border-radius:20px;box-shadow:0 8px 28px rgba(0,0,0,.2);line-height:1.3;transition:left .6s var(--ease),transform .6s var(--ease);animation:pop .55s var(--ease)}
.say small{display:block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#6E6E73;margin-bottom:2px}
.say b{font-size:19px;font-weight:600;letter-spacing:-.02em;display:block}
.say:after{content:"";position:absolute;bottom:-9px;left:var(--tail,50%);width:18px;height:18px;margin-left:-9px;background:#fff;transform:rotate(45deg);border-radius:0 0 5px 0}
.say.me{left:calc(11% - 10px);--tail:36px}
.say.mar{left:50%;transform:translateX(-50%);--tail:50%}
@media (max-width:640px){.say.me{left:8px}.say b{font-size:17px}}
.rcap .ln{animation:pop .6s var(--ease);font-size:20px;line-height:1.3;font-weight:600;letter-spacing:-.02em}
.rcap .ln small{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.rdots{display:flex;gap:6px;margin-top:10px}
.rdots i{width:22px;height:4px;border-radius:2px;background:var(--line);transition:background .4s}
.rdots i.on{background:var(--ink)}
.gauge{display:grid;gap:12px;max-width:620px;margin-top:10px}
.g{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-weight:600;font-size:14px}
.g .tr{height:12px;background:var(--chip);border-radius:6px;overflow:hidden}
.g .fi{height:100%;width:0;border-radius:6px;transition:width .6s var(--ease)}
.hint{color:var(--muted);font-size:14px;margin:10px 0 0}
.stopw{font-size:56px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums;margin:6px 0}
.crowd{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px;max-width:500px;margin:14px 0}
.crowd i{height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;background:var(--chip);color:var(--muted);transition:all .4s var(--ease)}
.crowd i.nod{background:var(--G);color:#fff;animation:nod .7s ease infinite alternate}
@keyframes nod{to{transform:translateY(4px)}}
input[type=range]{width:100%;max-width:480px;accent-color:var(--B);margin-top:8px}
.face{display:flex;gap:16px;align-items:center;margin-top:14px;flex-wrap:wrap}
.face .av{width:76px;height:76px}
.lean{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;align-items:flex-end;padding:10px 0}
.lean figure{margin:0;text-align:center;font-weight:600}
.lean svg{overflow:visible}
.lean .body{transform-origin:75px 160px;transition:transform 1s var(--ease)}
.pour{display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap;margin:12px 0 16px}
.gl{text-align:center;width:130px}
.cup{position:relative;margin:0 auto;border:3px solid var(--ink);border-top:0;border-radius:0 0 22px 22px;overflow:hidden;background:var(--chip)}
.cup .liq{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .5s var(--ease);background:var(--c)}
.gl.spill .cup{animation:shake .4s}
.gl .lab{font-weight:600;font-size:14px;margin-top:8px}.gl .nt{font-size:12px;color:var(--muted);min-height:2.4em}
.gl .boom{height:22px;font-weight:700;font-size:13px;color:var(--R)}
.lanes{display:grid;gap:10px;margin-top:12px}
.lane{position:relative;height:64px;border-radius:20px;background:var(--cbg);overflow:hidden}
.lane .run{position:absolute;left:6px;top:6px;width:52px;transition:left var(--dur,3s) var(--ease-r,ease-in-out)}
.lane .run .av{width:52px;height:52px;animation:none}
.lane .fin{position:absolute;right:10px;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--ink);opacity:.2}
.lane .vd{position:absolute;left:70px;right:70px;top:0;bottom:0;display:flex;align-items:center;font-weight:600;font-size:14px;opacity:0;transition:opacity .5s;line-height:1.25}
.lane .vd.on{opacity:1}
.lane .tg{position:absolute;right:18px;top:6px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--c)}
.slots{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.slot{width:62px;height:62px;border-radius:20px;border:0;background:var(--chip);display:grid;place-items:center;padding:0}
.slot .av{width:46px;height:46px;animation:none}
.battery{position:relative;height:42px;border:3px solid var(--ink);border-radius:12px;max-width:400px;padding:3px;margin-top:10px}
.battery:after{content:"";position:absolute;right:-11px;top:10px;width:6px;height:12px;background:var(--ink);border-radius:0 3px 3px 0}
.battery i{display:block;height:100%;border-radius:7px;background:var(--R);transition:width .6s var(--ease)}
.cheat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:16px}
.cheat .cc{border-radius:26px;padding:20px;background:var(--panel);box-shadow:var(--shadow);min-width:0}
.cheat h3{color:var(--c);font-size:26px;letter-spacing:-.025em;margin:10px 0 4px}
.cheat dt{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:12px}
.cheat dd{margin:2px 0 0;font-size:15px;line-height:1.4}
.foot{padding:56px 0 80px;color:var(--muted);font-size:13px;text-align:center;max-width:34em;margin:0 auto}
@media (max-width:640px){.flow .ar{display:none}.flow .st{flex-basis:100%}.two{grid-template-columns:1fr}.hero{padding-top:36px}.lesson{padding-top:56px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:opacity .2s!important}html{scroll-behavior:auto}.js .rv{transform:none}}
@media (prefers-reduced-transparency:reduce){body::before,.top,#drawer{-webkit-backdrop-filter:none;backdrop-filter:none;background:var(--panel)}}

/* ---- book ---- */
.wrap{max-width:920px}
.bookwrap{padding:18px 0 40px}
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted);margin:0 6px 12px;min-height:20px}
.crumb i{width:10px;height:10px;border-radius:50%;background:var(--cc,var(--N));flex:none}
.stage{position:relative;height:clamp(470px,calc(100dvh - 222px),820px);perspective:2600px;perspective-origin:25% 50%;overflow:hidden;border-radius:6px 22px 22px 6px;background:var(--panel);box-shadow:1px 1px 0 var(--line),3px 3px 0 var(--panel),4px 4px 0 var(--line),6px 6px 0 var(--panel),7px 7px 0 var(--line),0 26px 60px rgba(0,0,0,.14);isolation:isolate}
.pg{position:absolute;inset:0;transform-origin:left center;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:6px 22px 22px 6px;overflow:hidden}
.front{background:linear-gradient(90deg,rgba(0,0,0,.08),transparent 34px),var(--panel)}
.back{transform:rotateY(180deg);background:linear-gradient(270deg,rgba(0,0,0,.2),transparent 60%),var(--chip)}
.scroll{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;padding:clamp(24px,4.6vw,46px) clamp(22px,5vw,52px) 70px clamp(28px,5.4vw,58px);user-select:text;-webkit-user-select:text}
.folio{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;pointer-events:none}
.rib{position:absolute;top:0;right:clamp(18px,4vw,40px);width:28px;height:44px;border:0;padding:0;background:none;z-index:5;transition:transform .3s var(--ease)}
.rib:hover{transform:translateY(3px)}
.rib svg{width:28px;height:44px;display:block}
.rib path{fill:var(--line);transition:fill .3s}
.rib:hover path{fill:var(--muted)}
.rib.on path{fill:var(--R)}
.shade{position:absolute;inset:0;z-index:2;background:#000;pointer-events:none;opacity:0}
.ctrl{display:flex;align-items:center;gap:10px;margin-top:26px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--panel);box-shadow:var(--shadow);border-radius:999px;padding:12px 20px;font-weight:600;transition:transform .1s,opacity .2s}
.cbtn.pri{background:var(--B);color:#fff}
.cbtn:disabled{opacity:.35;cursor:default;box-shadow:none}
.cbtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.bmb svg{fill:none}.bmb.on{color:var(--R)}.bmb.on svg{fill:var(--R);stroke:var(--R)}
.pginfo{flex:1;text-align:center;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-width:90px}
@media (max-width:560px){.ctrl{gap:8px}.cbtn{padding:11px 14px}.bmb span{display:none}.pginfo{order:5;flex-basis:100%}}
.pg .mod{box-shadow:none;background:transparent;padding:0;margin:20px 0 0;border-radius:0}
.pg .rv{opacity:1!important;transform:none!important}
.pgh{font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:6px 0 16px}
.pg .eyebrow{color:var(--c,var(--muted))}
.welcome h1{font-size:clamp(36px,7vw,64px);line-height:1.03;letter-spacing:-.04em;font-weight:700;margin:8px 0 18px}
.welcome .row,.pg .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}
.finderhost .mod{padding:0;margin-top:16px}
.finderwrap h2{font-size:clamp(32px,6vw,52px);line-height:1.05;letter-spacing:-.035em;font-weight:700;margin:6px 0 12px}
.ptxt p{font-size:clamp(22px,3.2vw,30px);line-height:1.35;letter-spacing:-.022em;font-weight:500;margin:0 0 18px;text-wrap:pretty}
.ptxt p:first-child:first-letter{font-size:1.9em;float:left;line-height:.9;margin:6px 8px 0 0;font-weight:700;color:var(--c)}
.narr .eyebrow{margin-bottom:16px}
.qlist{display:grid;gap:14px;margin-top:14px}
.qcard{position:relative;padding:22px 22px 18px;border-radius:24px;background:var(--cbg)}
.qcard:before{content:"\201C";position:absolute;top:2px;left:16px;font-size:64px;line-height:1;font-weight:700;color:var(--c);opacity:.35}
.qcard p{margin:14px 0 12px;font-size:clamp(20px,3vw,26px);line-height:1.25;letter-spacing:-.022em;font-weight:600}
.own textarea{width:100%;border:0;border-radius:16px;background:var(--chip);color:var(--ink);padding:12px 14px;font:inherit;resize:vertical}
.qdel{margin-left:6px;color:var(--muted)!important}
.qshare{border:0;background:var(--panel);border-radius:999px;padding:7px 16px;font-weight:600;font-size:14px;color:var(--c)}
.pg .sowhat{margin-top:8px}
.ch-on{background:var(--line)}
.dsec{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:14px 12px 4px}
.sharepop{position:fixed;z-index:70;transform:translateX(-50%);background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:9px 18px;font-weight:600;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .3s var(--ease)}
.sharepop[hidden]{display:none}
.sharepop:after{content:"";position:absolute;left:50%;bottom:-5px;width:12px;height:12px;margin-left:-6px;background:var(--ink);transform:rotate(45deg);border-radius:0 0 3px 0;z-index:-1}
.toast{position:fixed;z-index:80;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;transition:all .4s var(--ease);pointer-events:none}
.toast.in{opacity:1;transform:translate(-50%,0)}

/* ---- open pages (override boxed book) ---- */
html,body{overflow-x:clip}
.bookwrap{overflow-x:clip;padding-bottom:0}
.stage{position:relative;height:auto;perspective:2600px;perspective-origin:20% 30%;overflow:visible;border-radius:0;background:none;box-shadow:none;isolation:auto}
.pg{position:relative;inset:auto;transform-origin:left center;transform-style:preserve-3d;will-change:auto}
.pg.abs{position:absolute;top:0;left:0;right:0}
.pg.turning{will-change:transform}
.front{display:block!important;position:relative;inset:auto;overflow:visible;background:none;border-radius:26px;padding:6px 0 28px}
.pg.turning .front{background:var(--panel);box-shadow:0 0 0 20px var(--panel),0 24px 60px rgba(0,0,0,.22)}
.back{display:none;position:absolute;inset:-20px;border-radius:30px;background:linear-gradient(270deg,rgba(0,0,0,.18),transparent 60%),var(--chip);transform:rotateY(180deg);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.pg.turning .back{display:block}
.scroll{position:static;inset:auto;overflow:visible;padding:0}
.folio{display:none}
.rib{top:-6px;right:clamp(0px,1vw,10px)}
.pg .mod{background:var(--panel);box-shadow:var(--shadow);padding:clamp(18px,3.4vw,28px);margin:16px 0;border-radius:28px}
.pg.turning .mod{box-shadow:none;background:var(--chip)}
.finderhost .mod{padding:clamp(18px,3.4vw,28px)}
.ctrl{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:15;margin:30px 0 14px;padding:8px;border-radius:999px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:var(--shadow),0 0 0 .5px var(--line);flex-wrap:nowrap;max-width:560px;margin-left:auto;margin-right:auto}
.ctrl .cbtn{box-shadow:none;background:var(--chip)}
.ctrl .cbtn.pri{background:var(--B)}
.ctrl .cbtn:disabled{background:transparent}
.cpg{display:none;margin-left:auto;font-variant-numeric:tabular-nums}
@media (max-width:560px){.pginfo{display:none}.cpg{display:inline}.ctrl{justify-content:space-between}.cbtn{padding:11px 16px}}

<body>
<script>document.documentElement.classList.add('js')</script>
<div class="top"><button class="ibtn" id="menu" aria-label="Open chapter list">Chapters</button><span class="nm">Surrounded by Idiots</span><div class="pbar"><i id="pfill"></i></div><span class="cnt" id="pcnt">0 / 22</span></div>
<nav id="drawer" aria-label="Chapters" aria-hidden="true"></nav>
<div class="scrim" id="scrim"></div>
<main class="wrap bookwrap">
  <div class="crumb" id="crumb"></div>
  <div class="stage" id="stage"></div>
  <div class="ctrl">
    <button class="cbtn" id="back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>Back</button>
    <button class="cbtn bmb" id="bmb" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4.5L6 21z"/></svg><span>Bookmark</span></button>
    <div class="pginfo" id="pginfo"></div>
    <button class="cbtn pri" id="next">Next<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <p class="foot">Interactive study guide based on "Surrounded by Idiots" by Thomas Erikson. Stories and lines are retold in plain words. Examples not from the book are marked.</p>
</main>

<script>
const $=(s,r=document)=>r.querySelector(s);
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};
const col=k=>`var(--${k})`, cbg=k=>`var(--${k}bg)`;
const CO={
  R:{n:"Red",tag:"Dominance",line:"Fast, blunt, wants to win",spot:"Talks first and loudest, interrupts, hates small talk",say:"Short. Main point first. Then the decision.",avoid:"Long intros, rambling, slow replies",trap:"Steamrolls people and skips details",quote:"Skip the intro. What's the decision?"},
  Y:{n:"Yellow",tag:"Inducement",line:"Talkative, upbeat, big-picture",spot:"Tells stories, laughs a lot, knows everyone",say:"Warm and friendly. Big picture first.",avoid:"Heavy detail, cold tone, long lectures",trap:"Loses focus, runs late, talks over others",quote:"You HAVE to hear what happened last night!"},
  G:{n:"Green",tag:"Submission",line:"Calm, loyal, hates sudden change",spot:"Quiet, listens, agrees in the meeting, worries after",say:"Patient. Explain why. Small steps. Criticism in private.",avoid:"Sudden change, public pressure",trap:"Avoids conflict and never says what they really think",quote:"Whatever works for everyone is fine with me."},
  B:{n:"Blue",tag:"Analytic",line:"Exact, careful, wants the facts",spot:"Asks for sources, corrects details, very organised",say:"Facts, preparation, checklists. No vague visions.",avoid:"Sloppy work, hype, guessing",trap:"Over-analyses and takes too long to decide",quote:"Before we decide, can I see the source?"},
};
const faceMouth={happy:'M17 33 Q26 43 35 33',mad:'M17 39 Q26 30 35 39',flat:'M19 37 H33',worry:'M17 38 Q21.5 33 26 38 Q30.5 43 35 38',shock:'M22 34 a4 5 0 1 0 8 0 a4 5 0 1 0 -8 0',smirk:'M18 36 Q27 40 35 33'};
function av(k,mood='happy'){
  const c=col(k);
  const brows=k==='R'||mood==='mad'?`<path d="M14 18 L23 22 M38 18 L29 22" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`:'';
  const specs=k==='B'?`<g fill="none" stroke="#fff" stroke-width="2"><rect x="13" y="20" width="11" height="9" rx="3"/><rect x="28" y="20" width="11" height="9" rx="3"/><path d="M24 24 H28"/></g>`:'';
  const m=faceMouth[mood]||faceMouth.happy;
  return `<svg class="av" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="26" fill="${c}"/><g class="eye" fill="#fff"><circle cx="19" cy="25" r="2.6"/><circle cx="33" cy="25" r="2.6"/></g>${brows}${specs}<path d="${m}" stroke="#fff" stroke-width="3" fill="${mood==='shock'?'#fff':'none'}" stroke-linecap="round"/></svg>`;
}
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- modules ---------------- */
const M={};
M.big=(m,ch)=>el(`<div class="big rv" style="--c:${col(ch.k)};--cbg:${cbg(ch.k)}"><small>The big idea</small>${m.text}</div>`);

M.chat=m=>{
  const w=el(`<div class="mod rv"><h3>${m.title||'Story'}</h3><div class="chat"></div><button class="nextbtn">Start</button></div>`);
  const box=$('.chat',w),btn=$('.nextbtn',w);let i=0,busy=false;
  const add=async()=>{
    if(busy)return; busy=true;
    if(i>=m.lines.length){box.innerHTML='';i=0}
    const [who,k,text,mood]=m.lines[i];
    if(who){const t=el(`<div class="bub"><span style="width:42px"></span><div class="tx" style="background:var(--Nbg);border-color:var(--line)"><span class="typing"><i></i><i></i><i></i></span></div></div>`);box.appendChild(t);await sleep(550);t.remove();}
    box.appendChild(el(`<div class="bub">${who?av(k,mood):'<span style="width:42px"></span>'}<div class="tx" style="background:${cbg(k)};border-color:${col(k)}">${who?`<b style="color:${col(k)}">${who}</b>`:''}${text}</div></div>`));
    i++; btn.textContent=i>=m.lines.length?'Replay':'Next'; busy=false;
  };
  btn.onclick=add; return w;
};

M.mcq=m=>{
  const w=el(`<div class="mod rv mq"><h3>${m.title||'Your turn'}</h3><div class="body"></div></div>`);
  const body=$('.body',w);let i=0,score=0;
  const show=()=>{
    if(i>=m.qs.length){
      body.innerHTML=`<p class="q">You got ${score} of ${m.qs.length}.</p><button class="ghost">Try again</button>`;
      $('.ghost',body).onclick=()=>{i=0;score=0;show()};return;}
    const q=m.qs[i];
    body.innerHTML=`<div class="meta"><span>Question ${i+1} of ${m.qs.length}</span><span>${score} correct</span></div>${q.mail?`<div class="mailbox">${q.mail}</div>`:''}<p class="q">${q.q}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div class="fbx"></div>`;
    body.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const j=+b.dataset.j,ok=j===q.a; if(ok)score++;
      body.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(+x.dataset.j===q.a)x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      $('.fbx',body).innerHTML=`<p class="fb"><b>${ok?'Yes.':'Not quite.'}</b> ${q.fb||''}</p><button class="nextbtn">${i+1<m.qs.length?'Next':'See score'}</button>`;
      $('.nextbtn',body).onclick=()=>{i++;show()};
    });
  };
  show();return w;
};

M.flip=m=>{
  const w=el(`<div class="mod rv"><h3>${m.title||'Tap to flip'}</h3><div class="flips"></div></div>`);
  m.cards.forEach(c=>{
    const f=el(`<button class="fl" aria-label="Flip card"><div class="in"><div class="s" style="background:${cbg(c.k)};border:2px solid ${col(c.k)}"><b style="color:${col(c.k)}">${c.front}</b><span class="hint">tap to flip</span></div><div class="s back" style="background:${col(c.k)};color:#fff"><span>${c.back}</span></div></div></button>`);
    f.onclick=()=>f.classList.toggle('f');$('.flips',w).appendChild(f);
  });return w;
};

M.flow=m=>el(`<div class="mod rv"><h3>${m.title||'How it goes'}</h3><div class="flow" style="--c:${col(m.accent||'N')}">${m.steps.map((s,i)=>(i?'<span class="ar">→</span>':'')+`<div class="st">${s}</div>`).join('')}</div></div>`);
M.steps=m=>el(`<div class="mod rv"><h3>${m.title||'Steps'}</h3><div class="steps" style="--c:${col(m.accent||'N')}">${m.items.map(i=>`<div>${i}</div>`).join('')}</div></div>`);
M.two=m=>el(`<div class="mod rv"><h3>${m.title||'Pros and cons'}</h3><div class="two"><div class="col good"><h4>Good at</h4><ul>${m.plus.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="col bad"><h4>Watch for</h4><ul>${m.minus.map(x=>`<li>${x}</li>`).join('')}</ul></div></div></div>`);
M.quote=m=>el(`<div class="mod rv"><div class="quote">${m.text}${m.who?`<small>${m.who}</small>`:''}</div></div>`);
M.prof=m=>el(`<div class="mod rv prof" style="--c:${col(m.k)};--cbg:${cbg(m.k)}">${av(m.k,m.mood||'happy')}<div><h3>${CO[m.k].n}: ${CO[m.k].tag}</h3><p style="margin:2px 0 10px;color:var(--muted)">${CO[m.k].line}</p><div class="traits">${m.traits.map(t=>`<span>${t}</span>`).join('')}</div></div></div>`);
M.bars=m=>{
  const mx=Math.max(...m.items.map(i=>i[1]));
  const w=el(`<div class="mod rv"><h3>${m.title||'Compare'}</h3><div class="bars">${m.items.map(([l,n,k])=>`<div><div class="lb"><span>${l}</span><b>${n} ${m.unit||''}</b></div><div class="tr"><div class="fi" data-w="${(n/mx*100).toFixed(1)}" style="background:${col(k)}"></div></div></div>`).join('')}</div></div>`);
  w._grow=()=>w.querySelectorAll('.fi').forEach(f=>f.style.width=f.dataset.w+'%');return w;
};
M.timeline=m=>el(`<div class="mod rv"><h3>${m.title||'Timeline'}</h3><div class="tl">${m.items.map(([y,t])=>`<div><b>${y}</b>${t}</div>`).join('')}</div></div>`);

M.filters=()=>{
  const out={R:"Friday. Fine. Done.",Y:"Friday? Great! Maybe we celebrate after!",G:"Friday... am I behind? Will someone be upset?",B:"Which Friday exactly? Which format and what standard?"};

M.onion=()=>{

  // order: outermost first so inner ones sit on top
  const order=[L[0],L[1],L[2]].reverse().reverse();
  [{...L[0],s:240},{...L[1],s:166},{...L[2],s:92}].forEach(r=>{
    const lay=r.n==="Core values"?{...r,real:240}:r;
  });
  const rings=[["The mask","R",240,"What others see. You pick a mask for work, home and the in-laws. Behaviour = personality x surroundings."],["Attitudes","G",170,"Opinions from your experiences. They can change. The author's relative thought most salespeople were crooks, so she returned every purchase."],["Core values","B",100,"Learned as a child. Almost impossible to change. Example: all people are equal."]];

M.matrix=()=>{
  const info={Y:["Yellow","Fast and people-focused. Talks, jokes, connects."],R:["Red","Fast and task-focused. Decides, pushes, wins."],G:["Green","Reflective and people-focused. Listens, supports, keeps peace."],B:["Blue","Reflective and task-focused. Checks, plans, perfects."]};

  const mx=$('.mx',w),dot=$('.dot',w);let drag=false;
  const move=e=>{if(!drag)return;const r=mx.getBoundingClientRect();let x=Math.min(Math.max(e.clientX-r.left,0),r.width),y=Math.min(Math.max(e.clientY-r.top,0),r.height);dot.style.left=x+'px';dot.style.top=y+'px';
    const k=y<r.height/2?(x<r.width/2?'Y':'R'):(x<r.width/2?'G':'B');dot.style.background=col(k);dot.textContent=info[k][0][0];$('#mxt',w).innerHTML=`<b style="color:${col(k)}">${info[k][0]}.</b> ${info[k][1]}`};
  dot.addEventListener('pointerdown',e=>{drag=true;dot.setPointerCapture(e.pointerId)});

};

M.call=()=>{
  const w=el(`<div class="mod rv"><h3>Play: the 8-second phone call</h3><div class="stopw" id="sw">0.0 s</div><div class="chat" id="cl" style="margin:10px 0"></div><button class="nextbtn" id="cb">Answer the call</button></div>`);

  const cr=$('#cr',w);for(let i=0;i<15;i++)cr.appendChild(el('<i>·</i>'));
  const set=sure=>{const kids=[...cr.children];kids.forEach((c,i)=>{const nod=sure||i<3;c.className=nod?'nod':'';c.textContent=nod?'✓':'?'});
    $('#ct',w).textContent=sure?'15 of 15 nod. Nobody checks the number.':'Only 3 nod. The rest ask where the number came from.'};

M.rain=()=>{
  const steps=[
    ["Author","me","It looks like it's going to rain.","wet"],
    ["Marita (Yellow)","mar","I can't imagine that.","wet"],
    ["Author","me","But look. It's pouring. Thunder soon.","wet"],
    ["Marita (Yellow)","mar","Sure. But the sun comes out after. Just wait.","wet"],
    ["Marita (Yellow)","mar","Told you!","sun"]];
  const w=el(`<div class="mod rv"><h3>Play: the rain test</h3><div class="sky" id="sky"><span class="cloud"></span><span class="drops"></span><span class="sunny"></span><svg class="rb" viewBox="0 0 320 160" aria-hidden="true"><path d="M12,160 A148,148 0 0 1 308,160" stroke="#FF3B30" stroke-width="9" fill="none"/><path d="M21,160 A139,139 0 0 1 299,160" stroke="#FF9500" stroke-width="9" fill="none"/><path d="M30,160 A130,130 0 0 1 290,160" stroke="#FFCC00" stroke-width="9" fill="none"/><path d="M39,160 A121,121 0 0 1 281,160" stroke="#34C759" stroke-width="9" fill="none"/><path d="M48,160 A112,112 0 0 1 272,160" stroke="#0A84FF" stroke-width="9" fill="none"/><path d="M57,160 A103,103 0 0 1 263,160" stroke="#5E5CE6" stroke-width="9" fill="none"/></svg><span class="ground"></span><div class="who2">${av('N','happy')}</div><div class="who">${av('Y','happy')}</div><div class="say me" id="say" aria-live="polite"></div></div><div class="rdots">${steps.map(()=>'<i></i>').join('')}</div><button class="nextbtn" id="rb">Make it rain</button><p class="hint">A real moment from the book: the author warns his Yellow sister about rain. She stays sure the sun is coming.</p></div>`);
  let run=0;
  $('#rb',w).onclick=async()=>{
    const my=++run,s=$('#sky',w),b=$('#rb',w),dots=w.querySelectorAll('.rdots i');
    b.disabled=true;s.classList.remove('sun');s.classList.remove('wet');
    for(let i=0;i<steps.length;i++){
      if(my!==run)return;
      const [who,pos,tx,st]=steps[i];
      if(st==='wet'){s.classList.add('wet');s.classList.remove('sun')}else{s.classList.remove('wet');s.classList.add('sun')}
      const old=$('#say',w),n=old.cloneNode(false);n.className='say '+pos;n.innerHTML=`<small>${who}</small><b>${tx}</b>`;old.replaceWith(n);
      dots.forEach((d,j)=>d.classList.toggle('on',j<=i));
      await sleep(4300);
    }
    b.disabled=false;b.textContent='Watch again';
  };
  return w;
};

M.team=()=>{
  const roles={Y:"Ideas",R:"Decisions",G:"Delivery",B:"Quality"};
  const single={R:"Fast decisions, loud meetings, details slip.",Y:"Great energy and ideas. No plan, no finish.",G:"Calm and kind. Nobody decides.",B:"A perfect plan that never starts."};
  const w=el(`<div class="mod rv"><h3>Play: build a team</h3><div class="pills" id="add"></div><div class="slots" id="sl"></div><div class="gauge" id="gg"></div><p><b id="tv"></b></p></div>`);
  let team=[];
  const draw=()=>{
    $('#sl',w).innerHTML='';
    for(let i=0;i<5;i++){const k=team[i];const b=el(`<button class="slot" aria-label="${k?'Remove '+CO[k].n:'Empty slot'}">${k?av(k):''}</button>`);if(k)b.onclick=()=>{team.splice(i,1);draw()};$('#sl',w).appendChild(b)}
    $('#gg',w).innerHTML=['Y','R','G','B'].map(k=>{const n=team.filter(x=>x===k).length;const p=Math.min(n,2)*50;return `<div class="g"><span>${roles[k]}</span><div class="tr"><div class="fi" style="width:${p}%;background:${col(k)}"></div></div><span>${p}%</span></div>`}).join('');
    const d=new Set(team);let t;
    if(!team.length)t='Add up to five people. Tap one to remove.';else if(d.size===1)t=single[team[0]];else if(d.size===4)t='Balanced. Ideas, decisions, delivery and quality are all covered.';else t='Missing: '+['Y','R','G','B'].filter(k=>!d.has(k)).map(k=>roles[k].toLowerCase()).join(', ')+'.';
    $('#tv',w).textContent=t;
  };
  ['R','Y','G','B'].forEach(k=>{const b=el(`<button class="pill on" style="background:${col(k)}">+ ${CO[k].n}</button>`);b.onclick=()=>{if(team.length<5){team.push(k);draw()}};$('#add',w).appendChild(b)});
  team=['R','R','R'];draw();return w;
};

M.pour=()=>{
  const gs=[{k:'R',n:'Red: shot glass',cap:3,w:46,h:70,nt:'Fills fast. Empties fast.'},{k:'Y',n:'Yellow: tumbler',cap:8,w:78,h:110,nt:'Warning signs, then guilt.'},{k:'G',n:'Green: barrel',cap:40,w:118,h:160,nt:'Rarely overflows. Turns inward.'}];
  const w=el(`<div class="mod rv"><h3>Play: annoy them (a little)</h3><div class="pour"></div><div class="pills"><button class="pill on" style="background:var(--ink);color:var(--bg)" id="a1">Annoy</button><button class="pill" id="a5">Big annoyance (+5)</button><button class="pill" id="a0">Reset</button></div><p class="hint" id="pt">Each tap adds irritation to all three.</p></div>`);
  const cnt=[0,0,0];
  const cups=gs.map((g,i)=>{const e=el(`<div class="gl" style="--c:${col(g.k)}"><div class="boom">&nbsp;</div><div class="cup" style="width:${g.w}px;height:${g.h}px"><div class="liq"></div></div><div class="lab" style="color:${col(g.k)}">${g.n}</div><div class="nt">${g.nt}</div></div>`);$('.pour',w).appendChild(e);return e});
  const upd=n=>{gs.forEach((g,i)=>{cnt[i]+=n;const c=cups[i],liq=$('.liq',c);
    if(cnt[i]>=g.cap){liq.style.height='100%';c.classList.add('spill');$('.boom',c).textContent=g.k==='R'?'Outburst! Then over it.':g.k==='Y'?'Outburst, then sorry.':'Finally.';
      setTimeout(()=>{cnt[i]=0;liq.style.height='0';c.classList.remove('spill');$('.boom',c).innerHTML='&nbsp;'},1300)}
    else{liq.style.height=(cnt[i]/g.cap*100)+'%';if(g.k==='Y'&&cnt[i]/g.cap>.7)$('.boom',c).textContent='Voice rising...';}
  })};
  $('#a1',w).onclick=()=>upd(1);$('#a5',w).onclick=()=>upd(5);
  $('#a0',w).onclick=()=>{cnt.fill(0);cups.forEach(c=>{$('.liq',c).style.height='0';$('.boom',c).innerHTML='&nbsp;'})};
  return w;
};

function buildFinder(){
  const s=FINDER_HOST;s.innerHTML=`<div class="finderwrap"><div class="eyebrow">Start here</div><h2>Find your colour</h2><p class="intro">Eight quick questions. Pick what feels most like you, not what you wish was true.</p><div class="mod" id="fq"></div></div>`;
  const box=s.querySelector('#fq');let i=0;const sc={R:0,Y:0,G:0,B:0};
  const ks=['R','Y','G','B'];
  const q=()=>{
    if(i>=FQ.length){
      const sorted=ks.slice().sort((a,b)=>sc[b]-sc[a]);const t=sorted[0],t2=sorted[1];
      box.innerHTML=`<p class="q">You're mostly ${CO[t].n}${sc[t2]>=sc[t]-1?` with a lot of ${CO[t2].n}`:''}.</p><div class="bars" id="fr"></div><div class="face" style="margin-top:16px">${av(t)}<div><b style="color:${col(t)}">${CO[t].n}: ${CO[t].line}</b><p style="margin:4px 0">Others should: ${CO[t].say.toLowerCase()}</p><p style="margin:4px 0"><b>Your trap:</b> ${CO[t].trap}</p></div></div><button class="ghost" style="margin-top:14px">Retake</button>`;
      $('#fr',box).innerHTML=ks.map(k=>`<div><div class="lb"><span>${CO[k].n}</span><b>${sc[k]}/8</b></div><div class="tr"><div class="fi" style="width:0;background:${col(k)}" data-w="${sc[k]/8*100}"></div></div></div>`).join('');
      setTimeout(()=>box.querySelectorAll('.fi').forEach(f=>f.style.width=f.dataset.w+'%'),50);
      $('.ghost',box).onclick=()=>{i=0;ks.forEach(k=>sc[k]=0);q()};
      store.set('sbi-me',t);return;}
    const [qq,os]=FQ[i];
    box.innerHTML=`<div class="mq"><div class="meta" style="display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:8px"><span>Question ${i+1} of ${FQ.length}</span></div><p class="q">${qq}</p><div class="opts">${os.map((o,j)=>`<button class="opt" data-k="${ks[j]}">${o}</button>`).join('')}</div></div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{sc[b.dataset.k]++;i++;q()});
  };q();
}

0:["It's a quiet Tuesday. Sture has run his business for forty years. He sighs and says what he says every day: he's surrounded by idiots.","A young interviewer laughs, sure it's a joke. It isn't. The interviewer asks one question back, gets thrown out, and spends the next decades working out what Sture was missing."],

11:["Friday afternoon. Someone says the team should have a party. Five minutes later it's decided, funded and half forgotten.","The one question nobody asked is how everyone will get there. Until the Blue in the corner does."],
12:["You have one piece of news for four very different people. You write it once, then rewrite it four times: shorter, warmer, gentler, and with sources.","Same news. Four versions. Four much better conversations."],
13:["A manager decides to thank their best person in front of the whole team. They expect smiles. They get a week of silence.","The thank-you wasn't wrong. The audience was."],
14:["A team of five Reds finishes in record time, and nobody can say whether it solved the right problem. A team of five Blues is still writing the checklist.","The best team isn't the most talented. It's the most varied."],

/* ---------------- book ---------------- */
let FINDER_HOST=null;
const done=new Set(store.get('sbi-done',[]));
let bms=store.get('sbi-bm',[]);
const accent=c=>col(c.k==='N'?'B':c.k), accentBg=c=>cbg(c.k==='N'?'B':c.k);
const PUBLIC_URL='https://deepesh-design.github.io/surrounded-by-idiots-interactive/';
const NAMES={filters:"What do they hear?",onion:"Your layers",matrix:"The map",garden:"The garden race",call:"The 8-second call",confident:"Confidence beats facts",rain:"The rain test",change:"How much notice?",bluecheck:"Win a Blue's trust",lean:"What unsure looks like",team:"Build a team",pour:"Anger glasses",battery:"A Red's battery",race:"The team experiment",quote:"Remember this",two:"Strengths and watch-outs"};
const WT={quote:1,flow:1,steps:1,two:1,bars:1,prof:1,timeline:2,flip:2,chat:2,filters:2,onion:2,matrix:3,garden:2,call:2,confident:2,rain:3,change:2,bluecheck:2,lean:2,tabs:2,team:3,pour:3,battery:2,race:3,mcq:3};
const modName=m=>m.title||NAMES[m.m]||(m.m==='prof'?CO[m.k].n+' profile':m.m==='mcq'?'Your turn':'Page');
const eyebrowOf=(c,i)=>i?`Chapter ${c.n}`:'Introduction';

function shareText(txt){
  const url=/^https?:/.test(location.href)?location.href.split('#')[0]:PUBLIC_URL;
  const msg=`Here's what I found in "Surrounded by Idiots" by Thomas Erikson:\n\n"${txt.trim()}"\n\nInteractive guide: ${url}`;
  if(navigator.share){return navigator.share({text:msg}).catch(()=>{})}
  return (navigator.clipboard?navigator.clipboard.writeText(msg):Promise.reject()).then(()=>toast('Copied. Paste it in any chat.')).catch(()=>toast('Sharing is not available here.'));
}
function toast(t){document.querySelectorAll('.toast').forEach(x=>x.remove());const n=el(`<div class="toast">${t}</div>`);document.body.appendChild(n);setTimeout(()=>n.classList.add('in'),10);setTimeout(()=>{n.classList.remove('in');setTimeout(()=>n.remove(),400)},2400)}

/* page builders */
function welcomePage(){
  const d=el(`<div class="welcome"><div class="eyebrow">A visual guide</div><h1>Why do some people drive you up the wall?</h1><p class="intro">People behave in four main ways, and the author gives each a colour. Learn to spot the colour and a lot of "idiots" turn out to be people who work differently from you.</p><p class="intro">Turn the pages. Each chapter has a story, a few things to play with, and one thing to try tomorrow. Tap the ribbon on a page to bookmark it. Select any text to share it.</p><div class="row"><button class="cta" id="open">Open the book</button></div></div>`);
  $('#open',d).onclick=()=>step(1);
  const saved=store.get('sbi-page',null);const si=PAGES.findIndex(p=>p.key===saved);
  if(si>2){const b=el(`<button class="ghost">Continue where you left off</button>`);b.onclick=()=>goTo(si);$('.row',d).appendChild(b)}
  return d;
}
function meetPage(){
  const MEET={R:["The Driver","Wants to decide and get going. Hates waiting.","Book it. Now."],Y:["The Spark","Wants fun, people and new ideas. Hates boring.","This will be amazing!"],G:["The Glue","Wants everyone comfortable and happy. Hates conflict.","Whatever works for everyone is fine."],B:["The Checker","Wants facts and a plan. Hates mistakes.","Has anyone read the reviews?"]};
  const d=el(`<div><div class="eyebrow">The cast</div><h2 class="pgh">Meet the four colours</h2><p class="intro">Picture four friends planning a weekend trip. Each reacts in their own way.</p><div class="meet"></div><p class="words"><b>Dominance</b> (Red) takes charge. <b>Inducement</b> (Yellow) wins people over. <b>Submission</b> (Green) is steady and supportive; it doesn't mean weak. <b>Analytic</b> (Blue) checks and compares.</p></div>`);
  ['R','Y','G','B'].forEach(k=>$('.meet',d).appendChild(el(`<div class="mc" style="--c:${col(k)};--cbg:${cbg(k)}">${av(k,k==='R'?'mad':'happy')}<h3>${CO[k].n}</h3><p class="role">${MEET[k][0]}</p><p style="margin:0">${MEET[k][1]}</p><div class="says"><small>At the trip meeting they say</small>"${MEET[k][2]}"</div></div>`)));
  return d;
}
function finderPage(){FINDER_HOST=el('<div class="finderhost"></div>');buildFinder();return FINDER_HOST}
function coverPage(c,i){
  const d=el(`<div class="cover" style="--c:${accent(c)};--cbg:${accentBg(c)}"><div class="eyebrow">${eyebrowOf(c,i)}</div><h2 class="pgh">${c.t}</h2></div>`);
  const T=TALK[i];if(T)d.appendChild(el(`<p class="intro">${T[0]}</p>`));
  const big=c.mods.find(m=>m.m==='big');if(big)d.appendChild(M.big(big,c));
  return d;
}
function narrPage(c,i){
  const n=NARR[i]||[];
  const d=el(`<div class="narr" style="--c:${accent(c)}"><div class="eyebrow">${eyebrowOf(c,i)} · The story</div><div class="ptxt">${n.map(p=>`<p>${p}</p>`).join('')}</div></div>`);
  return d;
}
function modPage(c,i,g){
  const d=el(`<div style="--c:${accent(c)}"><div class="eyebrow">${eyebrowOf(c,i)} · ${c.t}</div></div>`);
  g.mods.forEach(m=>{const f=M[m.m];if(!f)return;const node=f(m,c);const ld=m.lead||LEAD[m.m];
    if(ld){const p=el(`<p class="sub">${ld}</p>`);const h=$('h3',node);h?h.after(p):node.prepend(p)}
    d.appendChild(node)});
  return d;
}
function linesPage(c,i){
  const L=KEY[i]||[];const sk='sbi-own-'+i;
  const d=el(`<div style="--c:${accent(c)};--cbg:${accentBg(c)}"><div class="eyebrow">${eyebrowOf(c,i)} · Lines worth keeping</div><p class="sub" style="margin-top:6px">Tap Share on a line, or select any text on a page to send it to a friend.</p><div class="qlist"></div>
  <div class="own"><h3 style="font-size:17px;margin:22px 0 6px">Add a line from your copy of the book</h3><textarea id="ownt-${i}" rows="3" placeholder="Paste the passage you want to keep"></textarea><button class="nextbtn" id="ownb-${i}" style="margin-top:8px">Save line</button><div class="qlist own-list" style="margin-top:14px"></div></div></div>`);
  const addCard=(q,own,idx)=>{const card=el(`<div class="qcard"><p></p><button class="qshare" aria-label="Share this line">Share</button>${own?'<button class="qshare qdel" aria-label="Remove this line">Remove</button>':''}</div>`);
    $('p',card).textContent=q;$('.qshare',card).onclick=()=>shareText(q);
    if(own)$('.qdel',card).onclick=()=>{const a=store.get(sk,[]);a.splice(idx,1);store.set(sk,a);renderOwn()};
    return card};
  L.forEach(q=>$('.qlist',d).appendChild(addCard(q,false)));
  const renderOwn=()=>{const box=$('.own-list',d);box.innerHTML='';store.get(sk,[]).forEach((q,j)=>box.appendChild(addCard(q,true,j)))};
  $('#ownb-'+i,d).onclick=()=>{const ta=$('#ownt-'+i,d),v=ta.value.trim();if(!v)return;const a=store.get(sk,[]);a.push(v);store.set(sk,a);ta.value='';renderOwn();toast('Saved in this browser')};
  renderOwn();return d;
}
function endPage(c,i){
  const T=TALK[i];
  const d=el(`<div style="--c:${accent(c)};--cbg:${accentBg(c)}"><div class="eyebrow">${eyebrowOf(c,i)} · Wrap up</div><h2 class="pgh">${c.t}</h2></div>`);
  if(T)d.appendChild(el(`<div class="sowhat"><b>Try this tomorrow</b>${T[1]}</div>`));
  const row=el(`<div class="row"><button class="donebtn"></button><button class="nextbtn" style="margin:0"></button></div>`);
  const b=$('.donebtn',row),nb=$('.nextbtn',row);
  const mark=()=>{b.classList.toggle('on',done.has(i));b.textContent=done.has(i)?'Done ✓':'Mark chapter as done'};
  b.onclick=()=>{done.has(i)?done.delete(i):done.add(i);store.set('sbi-done',[...done]);mark();renderDone()};
  nb.textContent=i<CH.length-1?'Next chapter':'Cheat sheet';nb.onclick=()=>step(1);mark();
  d.appendChild(row);return d;
}
function cheatPage(){
  const d=el(`<div style="--c:var(--B)"><div class="eyebrow">Keep this</div><h2 class="pgh">Cheat sheet</h2><p class="big" style="margin:8px 0 12px">Nobody is an idiot. They just run on a different colour.</p></div>`);
  d.appendChild(M.cheat());return d;
}

/* page list */
const PAGES=[];
PAGES.push({key:'f0',label:'Welcome',build:welcomePage});
PAGES.push({key:'f1',label:'Meet the four colours',build:meetPage});
PAGES.push({key:'f2',label:'Find your colour',build:finderPage});
const FIRST={};
CH.forEach((c,i)=>{
  FIRST[i]=PAGES.length;
  PAGES.push({key:`c${i}p0`,ch:i,label:`${c.t}`,build:()=>coverPage(c,i)});
  if(NARR[i])PAGES.push({key:`c${i}s`,ch:i,label:`${c.t} · The story`,build:()=>narrPage(c,i)});
  const groups=[];let cur=null;
  c.mods.forEach(m=>{if(m.m==='big')return;const w=WT[m.m]||2;
    if(cur&&cur.w+w<=3){cur.mods.push(m);cur.w+=w}else{cur={mods:[m],w};groups.push(cur)}});
  groups.forEach((g,j)=>PAGES.push({key:`c${i}p${j+1}`,ch:i,label:`${c.t} · ${modName(g.mods[0])}`,build:()=>modPage(c,i,g)}));
  if(KEY[i])PAGES.push({key:`c${i}k`,ch:i,label:`${c.t} · Lines worth keeping`,build:()=>linesPage(c,i)});
  PAGES.push({key:`c${i}end`,ch:i,label:`${c.t} · Wrap up`,build:()=>endPage(c,i)});
});
PAGES.push({key:'z0',label:'Cheat sheet',build:cheatPage});
const idxOf=key=>PAGES.findIndex(p=>p.key===key);

function ribbonSVG(){return '<svg viewBox="0 0 30 46" aria-hidden="true"><path d="M0 0H30V46L15 35L0 46Z"/></svg>'}
function getEl(n){
  const p=PAGES[n];if(p.el)return p.el;
  const pg=el(`<section class="pg" aria-label="${p.label.replace(/"/g,'')}"><div class="face front"><div class="scroll"></div><button class="rib" aria-label="Bookmark this page">${ribbonSVG()}</button><div class="folio">${n+1}</div></div><div class="face back"></div></section>`);
  $('.scroll',pg).appendChild(p.build());
  $('.rib',pg).onclick=()=>toggleBM(p.key);
  pg._grows=[...pg.querySelectorAll('*')].filter(x=>x._grow).map(x=>x._grow);
  p.el=pg;return pg;
}

/* bookmarks */
const isBM=k=>bms.includes(k);
function toggleBM(k){k=k||PAGES[idx].key;bms=isBM(k)?bms.filter(x=>x!==k):[...bms,k];store.set('sbi-bm',bms);refreshBM();toast(isBM(k)?'Bookmarked':'Bookmark removed')}
function refreshBM(){
  PAGES.forEach(p=>{if(p.el)$('.rib',p.el).classList.toggle('on',isBM(p.key))});
  const on=isBM(PAGES[idx].key);const b=$('#bmb');b.setAttribute('aria-pressed',on);b.classList.toggle('on',on);$('span',b).textContent=on?'Bookmarked':'Bookmark';
  const list=$('#bml');if(!list)return;
  list.innerHTML=bms.length?bms.map(k=>{const n=idxOf(k);return n<0?'':`<a href="#" data-key="${k}"><span class="dn" style="background:var(--R)">★</span>${PAGES[n].label}<span class="ck" style="color:var(--muted);font-weight:500">p.${n+1}</span></a>`}).join(''):'<p class="hint" style="padding:6px 12px">No bookmarks yet. Tap the ribbon on any page.</p>';
}
function renderDone(){
  $('#pfill').style.width=(done.size/CH.length*100)+'%';$('#pcnt').textContent=`${done.size}/${CH.length}`;
  document.querySelectorAll('[data-ck]').forEach(n=>n.textContent=done.has(+n.dataset.ck)?'✓':'');
}

/* navigation with page turn */
const stage=$('#stage');
let idx=Math.max(0,idxOf(store.get('sbi-page','f0'))),busy=false,queued=null;
const DUR=1000,EASE='cubic-bezier(.55,.04,.2,1)';
function paint(){
  const p=PAGES[idx],c=p.ch!==undefined?CH[p.ch]:null;
  $('#crumb').innerHTML=`<i style="--cc:${c?accent(c):'var(--B)'}"></i><span>${c?(p.ch?`Chapter ${c.n} · `:'')+c.t:p.label}</span><span class="cpg">p.${idx+1}</span>`;
  $('#pginfo').textContent=`Page ${idx+1} of ${PAGES.length}`;
  $('#back').disabled=idx===0;$('#next').disabled=idx===PAGES.length-1;
  store.set('sbi-page',p.key);refreshBM();
  const pg=getEl(idx);setTimeout(()=>pg._grows.forEach(f=>f()),80);
  document.querySelectorAll('.ch-on').forEach(n=>n.classList.remove('ch-on'));
  if(p.ch!==undefined){const a=document.querySelector(`#drawer a[data-ch="${p.ch}"]`);a&&a.classList.add('ch-on')}
}
async function goTo(n){
  n=Math.max(0,Math.min(PAGES.length-1,n));
  if(n===idx)return;
  hidePop();
  const top=stage.getBoundingClientRect().top;
  if(top<40)window.scrollBy({top:top-72,behavior:'auto'});
  stage.replaceChildren(getEl(n));
  idx=n;paint();
}
const step=d=>goTo(idx+d);

/* share on selection */
const pop=el(`<button class="sharepop" hidden>Share</button>`);document.body.appendChild(pop);
let selTimer,popText='';
function hidePop(){pop.hidden=true}
function updatePop(){
  const sel=getSelection();const t=sel?sel.toString().trim():'';
  if(!t||t.length<3||!sel.rangeCount){hidePop();return}
  const r=sel.getRangeAt(0),n=r.commonAncestorContainer,host=n.nodeType===1?n:n.parentElement;
  if(!host||!host.closest('.stage')||host.closest('input,textarea')){hidePop();return}
  const rc=r.getBoundingClientRect();popText=t;pop.hidden=false;
  pop.style.left=Math.min(Math.max(rc.left+rc.width/2,56),innerWidth-56)+'px';
  pop.style.top=Math.max(rc.top-50,64)+'px';
}
document.addEventListener('selectionchange',()=>{clearTimeout(selTimer);selTimer=setTimeout(updatePop,140)});
pop.addEventListener('pointerdown',e=>e.preventDefault());
pop.addEventListener('mousedown',e=>e.preventDefault());
pop.onclick=()=>{shareText(popText);hidePop()};

/* drawer */
const D=$('#drawer');
D.innerHTML='<div class="dhead"><b>Contents</b><button class="dclose" id="dclose" aria-label="Close contents">✕</button></div><div class="dsec">Chapters</div>'
  +CH.map((c,i)=>`<a href="#" data-ch="${i}"><span class="dn" style="background:${col(c.k)}">${c.n}</span>${c.t}<span class="ck" data-ck="${i}"></span></a>`).join('')
  +'<a href="#" data-key="z0"><span class="dn" style="background:var(--B)">★</span>Cheat sheet</a><div class="dsec">Bookmarks</div><div id="bml"></div>';
const setDrawer=o=>{D.classList.toggle('open',o);$('#scrim').classList.toggle('on',o);D.setAttribute('aria-hidden',!o);document.body.style.overflow=o?'hidden':''};
$('#menu').onclick=()=>setDrawer(true);$('#dclose').onclick=()=>setDrawer(false);$('#scrim').onclick=()=>setDrawer(false);
D.onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();
  if(a.dataset.ch!==undefined)goTo(FIRST[+a.dataset.ch]);else if(a.dataset.key)goTo(idxOf(a.dataset.key));setDrawer(false)};
$('#back').onclick=()=>step(-1);$('#next').onclick=()=>step(1);$('#bmb').onclick=()=>toggleBM();
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){setDrawer(false);return}
  if(e.target.closest&&e.target.closest('input,textarea,select'))return;
  if(D.classList.contains('open'))return;
  if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1);
});
stage.appendChild(getEl(idx));renderDone();paint();

</script>
